[package]
name = "hwp-core"
version = "0.1.0"
edition = "2021"
description = "HWP 5.x binary parser producing the Narro document-model JSON contract"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
cfb = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
