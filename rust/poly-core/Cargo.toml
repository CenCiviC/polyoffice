[package]
name = "poly-core"
version = "0.1.0"
edition = "2021"
description = "한글(.hwp/.hwpx)·Word(.doc/.docx)·오픈오피스(.odt) 파서 — PolyOffice 문서 모델 JSON 계약을 낸다"
license = "Apache-2.0"
repository = "https://github.com/CenCiviC/polyoffice"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
cfb = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
